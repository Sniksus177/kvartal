<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Заявки</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="header">
    <a class="logo" href="/">НОВЫЙ КВАРТАЛ</a>
    <nav><a href="/">На главную</a><a href="/logout">Выйти</a></nav>
</header>
<main class="section">
    <h1>Заявки с сайта</h1>
    {% if applications %}
    <div class="table-wrap">
        <table>
            <tr><th>Имя</th><th>Телефон</th><th>Комментарий</th></tr>
            {% for item in applications %}
            <tr><td>{{ item.name }}</td><td>{{ item.phone }}</td><td>{{ item.comment }}</td></tr>
            {% endfor %}
        </table>
    </div>
    {% else %}
    <p>Пока заявок нет.</p>
    {% endif %}
</main>
</body>
</html>
