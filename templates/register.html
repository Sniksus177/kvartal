<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="header">
    <a class="logo" href="/">НОВЫЙ КВАРТАЛ</a>
    <nav><a href="/">На главную</a><a href="/user/login">Войти</a></nav>
</header>
<main class="section">
    <div class="login-box">
        <h1>Регистрация</h1>
        <p>Создайте аккаунт, чтобы пользоваться личным кабинетом.</p>
        {% if error %}<div class="message error">{{ error }}</div>{% endif %}
        <form class="contact-form" action="/register" method="post">
            <input type="text" name="name" placeholder="Ваше имя" minlength="2" required>
            <input type="email" name="email" placeholder="Электронная почта" autocomplete="email" required>
            <input type="password" name="password" placeholder="Пароль (минимум 8 символов)" minlength="8" autocomplete="new-password" required>
            <input type="password" name="password_repeat" placeholder="Повторите пароль" minlength="8" autocomplete="new-password" required>
            <button class="button" type="submit">Зарегистрироваться</button>
        </form>
    </div>
</main>
</body>
</html>
